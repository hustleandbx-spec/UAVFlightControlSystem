schema_version: 1
namespace: /uav
message_package: flightcore_msgs
authority: FlightCore Bus contract mapped through Simulink ROS Toolbox and ROS2 DDS

topics:
  sensor_imu:
    topic: /uav/sensors/imu
    direction: subscribe
    msg: flightcore_msgs/Imu
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10
    rate_hz: 100
    maps_to_bus: IMU_BUS
    bus_fields:
      Accel: accel_mps2
      Gyro: gyro_radps
      Valid: valid
      Timestamp: timestamp_sec

  sensor_gps:
    topic: /uav/sensors/gps
    direction: subscribe
    msg: flightcore_msgs/Gps
    qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10
    rate_hz: 10
    maps_to_bus: GPS_BUS
    bus_fields:
      Lat: lat_deg
      Lon: lon_deg
      Alt: alt_m
      Velocity: velocity_ned_mps
      Valid: valid
      Timestamp: timestamp_sec

  flight_cmd:
    topic: /uav/cmd/flight
    direction: subscribe
    msg: flightcore_msgs/FlightCmd
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 5
    rate_hz: 50
    maps_to_bus: FlightCmdBus
    bus_fields:
      Position_NED_SP: position_ned_sp_m
      Velocity_NED_SP: velocity_ned_sp_mps
      Yaw_SP: yaw_sp_rad
      Mode: mode
      Valid: valid

  esc_cmd:
    topic: /uav/actuator/esc_cmd
    direction: publish
    msg: flightcore_msgs/EscCmd
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
    rate_hz: 50
    maps_from_bus: EscCmdBus
    bus_fields:
      MotorCmd: motor_cmd

  state_est:
    topic: /uav/estimator/state
    direction: publish
    msg: flightcore_msgs/StateEst
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
    rate_hz: 50
    maps_from_bus: StateEstBus
    bus_fields:
      Position_NED: position_ned_m
      Velocity_NED: velocity_ned_mps
      Attitude_quat: attitude_quat_wxyz
      AngularRate_Body: angular_rate_body_radps
      Accel_Body: accel_body_mps2
      GyroBias: gyro_bias_radps
      AccelBias: accel_bias_mps2
      Wind_NED: wind_ned_mps
      Status: status

  system_health:
    topic: /uav/health/status
    direction: publish
    msg: flightcore_msgs/SystemHealth
    qos:
      reliability: reliable
      durability: volatile
      history: keep_last
      depth: 10
    rate_hz: 10
    source: ROS2 boundary health
