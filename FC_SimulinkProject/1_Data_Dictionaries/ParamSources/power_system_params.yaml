# =============================================================================
# 动力系统参数 — PowerSystemDict.sldd 的 YAML 源定义
# =============================================================================
# 本文件是 PowerSystemDict.sldd 的唯一事实来源。
# 修改参数后运行 create_PowerSystemDict() 重新生成字典。
#
# 动力模型: 油门 → 稳态转速 → 推力/扭矩 → 电机指令 → 总推力/力矩
# 后续将按 PS_ 前缀统一重命名，当前键名保持与模型块一致。
# =============================================================================

_meta:
  dict_name: PowerSystemDict.sldd
  dict_path: 2_Model/power_system
  description: "动力系统参数（电池电压、推力系数、扭矩系数、转子惯量）"
  references:
    - GlobalTypes.sldd
    - VehicleDict.sldd

# =============================================================================
# AirSim RotorActuator
# =============================================================================

motorMaxThrust_N:
  rename_to: PS_MOTOR_MAX_THRUST_N
  type: single
  default: 4.179446268
  min: 0.1
  max: 20.0
  unit: "N"
  group: airsim_actuator
  storage_class: ExportedGlobal
  description: "AirSim Generic Quad 单旋翼最大推力。normalized command 1.0 线性对应此推力"
  tunable_in_flight: false
  safety_level: critical

motorMaxReactionTorque_Nm:
  rename_to: PS_MOTOR_MAX_REACTION_TORQUE_NM
  type: single
  default: 0.055562
  min: 0.001
  max: 1.0
  unit: "N*m"
  group: airsim_actuator
  storage_class: ExportedGlobal
  description: "AirSim Generic Quad 单旋翼最大反扭矩。normalized command 1.0 线性对应此反扭矩"
  tunable_in_flight: false
  safety_level: critical

motorTimeConstant_s:
  rename_to: PS_MOTOR_TIME_CONSTANT_S
  type: single
  default: 0.005
  min: 0.001
  max: 0.1
  unit: "s"
  group: airsim_actuator
  storage_class: ExportedGlobal
  description: "AirSim RotorActuator normalized control signal 一阶低通时间常数"
  tunable_in_flight: false
  safety_level: critical
