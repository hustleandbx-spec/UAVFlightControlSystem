# =============================================================================
# 气压计传感器参数 — TDK InvenSense ICP-20100
# =============================================================================
# 误差内核: altimeterSensor（Sensor Fusion and Tracking Toolbox）
# 高度↔压力换算: atmoscoesa（Aerospace Toolbox，1976 COESA 标准大气）
#
# 器件规格（TDK 公开规格）:
#   压力范围 30~110 kPa；压力噪声 0.4 Pa RMS；温度系数 ±0.5 Pa/°C；
#   可探测 <5 cm 高度变化；可配置 ODR/OSR；数字压力+温度输出。
#
# 量纲说明: altimeterSensor 的 ConstantBias/NoiseDensity/BiasInstability 为高度域。
#   海平面附近 dp/dh ≈ -12.0 Pa/m
#   0.4 Pa RMS → 0.4/12.0 ≈ 0.033 m RMS
#   噪声密度 ≈ 0.033 / sqrt(BW)，BW 取 ODR/2 = 25 Hz → ≈ 0.0067 m/sqrt(Hz)

BARO_SAMPLE_RATE:
  rename_to: BARO_SAMPLE_RATE
  type: single
  default: 50
  min: 1
  max: 200
  unit: "Hz"
  group: baro_config
  storage_class: ExportedGlobal
  description: "气压计更新率（ICP-20100 可配置 ODR），同时作为 altimeterSensor 的 SampleRate"
  tunable_in_flight: false
  safety_level: routine

BARO_SEED:
  rename_to: BARO_SEED
  type: double
  default: 45601
  min: 0
  max: 4294967295
  unit: ""
  group: baro_config
  storage_class: ExportedGlobal
  description: "altimeterSensor 随机流种子，保证确定性复现"
  tunable_in_flight: false
  safety_level: routine

BARO_CONST_BIAS:
