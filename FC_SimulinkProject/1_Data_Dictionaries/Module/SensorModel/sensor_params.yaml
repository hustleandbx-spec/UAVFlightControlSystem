# =============================================================================
# GPS / RTK 传感器参数 — 误差预算（DOP 方案 L1）
# =============================================================================
# DOP 由 GnssScenarioBus 场景输入提供；σ 由误差预算派生并写入 GPSBus.Eph/Epv：
#   码/浮点解 : σ_h = HDOP * GPS_UERE_H ;  σ_v = VDOP * GPS_UERE_V
#   RTK 固定  : σ_h = sqrt(RTK_SIGMA_H^2 + (BASELINE_PPM*1e-6*baseline)^2 + MULTIPATH_SIGMA^2)
#   时间相关  : 一阶 Gauss-Markov，相关时间 GM_TAU，稳态 σ = GM_SIGMA
# gpsSensor（官方）只做白噪声与失锁衰减；DOP 缩放、1ppm 基线项、多路径与
# Gauss-Markov 相关项由 sensor_GPS_model 外壳承载，不重复实现官方误差机理。

GPS_UERE_H:
  rename_to: GPS_UERE_H
  type: single
  default: 0.6
  min: 0.01
  max: 10.0
  unit: "m"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "码/浮点解水平测距误差 UERE(1σ)，HDOP=1 下的等效水平σ。σ_h = HDOP * UERE_H"
  tunable_in_flight: false
  safety_level: routine

GPS_UERE_V:
  rename_to: GPS_UERE_V
  type: single
  default: 1.2
  min: 0.01
  max: 20.0
  unit: "m"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "码/浮点解垂直测距误差 UERE(1σ)。σ_v = VDOP * UERE_V"
  tunable_in_flight: false
  safety_level: routine

GPS_UERE_VEL:
  rename_to: GPS_UERE_VEL
  type: single
  default: 0.1
  min: 0.001
  max: 5.0
  unit: "m/s"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "测速(多普勒)误差(1σ)，三轴共用，与几何弱相关"
  tunable_in_flight: false
  safety_level: routine

GPS_RTK_SIGMA_H:
  rename_to: GPS_RTK_SIGMA_H
  type: single
  default: 0.015
  min: 0.001
  max: 1.0
  unit: "m"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "RTK 固定解水平基座σ(1σ)，对应 RTK 定位 ±1~2cm"
  tunable_in_flight: false
  safety_level: routine

GPS_RTK_SIGMA_V:
  rename_to: GPS_RTK_SIGMA_V
  type: single
  default: 0.025
  min: 0.001
  max: 2.0
  unit: "m"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "RTK 固定解垂直基座σ(1σ)，典型 1.5~2x 水平"
  tunable_in_flight: false
  safety_level: routine

GPS_BASELINE_PPM:
  rename_to: GPS_BASELINE_PPM
  type: single
  default: 1.0
  min: 0.0
  max: 50.0
  unit: "ppm"
  group: gps_budget
  storage_class: ExportedGlobal
  description: "基线相关项(ppm)。误差贡献 = PPM*1e-6*基线长(m)，固定解水平项内平方相加"
