  default: 0.007
  min: 1.0e-4
  max: 1.0
  unit: "m/sqrt(Hz)"
  group: baro_noise
  storage_class: ExportedGlobal
  description: "高度域噪声密度。ICP-20100 压力噪声 0.4 Pa RMS ≈ 0.033 m RMS；BW≈25 Hz → 0.0067，保守取 0.007。P2 按 datasheet 噪声-OSR 表细化"
