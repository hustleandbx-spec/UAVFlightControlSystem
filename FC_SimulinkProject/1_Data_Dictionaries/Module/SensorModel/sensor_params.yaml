# =============================================================================
# 磁力计传感器参数 — 工业级 MEMS 三轴磁力计（型号待定）
# =============================================================================
# 误差内核: imuSensor('accel-mag') + magparams（Sensor Fusion and Tracking Toolbox）
# 参考场:   wrldmagm（Aerospace Toolbox，WMM；NED nT -> 边界换算 uT）
#
# 量纲: magparams 全部为 uT 口径（MeasurementRange/ConstantBias/NoiseDensity/
#   BiasInstability/RandomWalk/TemperatureBias 均为 uT 系；AxesMisalignment 为 %，
#   100 = 单位阵 = 无失准）。已在本机 R2025b 实测确认。
# 姿态约定: imuSensor 的 orientation 为 NED->body（C_nb）；仓库 Attitude_quat 为
#   body->NED（C_bn），故模型中须取其共轭。
# 全部数值【暂定】，待指定磁力计型号后按 datasheet/Allan 方差回填。

MAG_SAMPLE_RATE:
  rename_to: MAG_SAMPLE_RATE
  type: single
  default: 100
  min: 10
  max: 400
  unit: "Hz"
  group: mag_config
  storage_class: ExportedGlobal
  description: "磁力计更新率，同时作为 imuSensor 的 SampleRate"
  tunable_in_flight: false
  safety_level: routine

MAG_SEED:
